<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاشة الحضور</title>
<style>
  :root {
    --bg: #0d1a1c; --panel: #14272a; --ink: #eef5f4; --muted: #9db4b3;
    --accent: #3fc1ad; --line: #26403f; --bad: #ff9d94;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif; line-height: 1.5;
  }
  .view { display: none; min-height: 100%; }
  .view.active { display: flex; }
  input, button { font: inherit; }
  input {
    width: 100%; color: var(--ink); background: var(--panel); border: 1.5px solid var(--line);
    border-radius: 12px; padding: 13px 14px;
  }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  .btn { padding: 14px 22px; border: 0; border-radius: 12px; font-weight: 700; background: var(--accent); color: #062623; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }

  /* إعداد */
  #v-setup { align-items: center; justify-content: center; padding: 24px; }
  .card { width: 100%; max-width: 440px; }
  .card h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .card p { margin: 0 0 8px; color: var(--muted); }
  .card .btn { width: 100%; margin-top: 22px; }
  .err { color: var(--bad); min-height: 1.5em; margin-top: 10px; }

  /* العرض */
  #v-live { align-items: center; justify-content: center; gap: clamp(24px, 5vw, 80px); padding: 24px; flex-wrap: wrap; }
  .qrbox { background: #fff; padding: clamp(14px, 2vw, 26px); border-radius: 24px; width: min(86vw, 62vh, 560px); aspect-ratio: 1; display: flex; }
  #qr { width: 100%; height: 100%; }
  #qr canvas { width: 100% !important; height: 100% !important; display: block !important; image-rendering: pixelated; }
  #qr img { display: none !important; }
  .side { min-width: 260px; max-width: 440px; flex: 1 1 260px; }
  .lecture { color: var(--muted); font-size: clamp(1rem, 2vw, 1.4rem); margin: 0 0 6px; word-break: break-word; }
  .count { font-size: clamp(5rem, 16vw, 11rem); font-weight: 800; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
  .count-label { font-size: clamp(1.2rem, 2.4vw, 1.8rem); margin: 6px 0 22px; }
  .steps { color: var(--muted); margin: 0 0 22px; padding: 0 20px 0 0; font-size: 1.05rem; }
  .bar { height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; }
  .bar > div { height: 100%; width: 100%; background: var(--accent); transform-origin: right; }
  .bar-note { color: var(--muted); font-size: .9rem; margin: 6px 0 22px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .actions .btn { padding: 10px 16px; }
  #liveErr { color: var(--bad); min-height: 1.5em; }
</style>
</head>
<body>

<section id="v-setup" class="view active">
  <div class="card">
    <h1>بدء محاضرة</h1>
    <p>اكتب اسم المحاضرة وكلمة المرور، ثم اعرض الشاشة على البروجكتور.</p>
    <label for="lecture">اسم المحاضرة</label>
    <input id="lecture" placeholder="مثال: برمجة 1 - محاضرة 5">
    <label for="pass">كلمة مرور الدكتور</label>
    <input id="pass" type="password" autocomplete="current-password">
    <div class="err" id="setupErr" role="alert"></div>
    <button class="btn" id="startBtn">عرض الكود</button>
  </div>
</section>

<section id="v-live" class="view">
  <div class="qrbox"><div id="qr"></div></div>
  <div class="side">
    <p class="lecture" id="lectureName"></p>
    <div class="count" id="count">0</div>
    <div class="count-label">طالب سجّلوا حضورهم</div>
    <ol class="steps">
      <li>افتح تطبيق الحضور على هاتفك</li>
      <li>وجّه الكاميرا نحو هذا الكود</li>
    </ol>
    <div class="bar"><div id="barFill"></div></div>
    <p class="bar-note">يتغير الكود كل <span id="winSec">20</span> ثانية، فلا يمكن تصويره وإرساله لغائب.</p>
    <div id="liveErr" role="alert"></div>
    <div class="actions">
      <button class="btn ghost" id="fsBtn">ملء الشاشة</button>
      <button class="btn ghost" id="stopBtn">إنهاء المحاضرة</button>
    </div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let qr = null, timer = null, anim = null, running = false, pass = '', lecture = '';

  function show(name) {
    document.querySelectorAll('.view').forEach((v) => v.classList.remove('active'));
    $('v-' + name).classList.add('active');
  }
  try { $('lecture').value = localStorage.getItem('att_lecture') || ''; } catch (e) {}

  $('startBtn').onclick = async function () {
    lecture = $('lecture').value.trim();
    pass = $('pass').value;
    $('setupErr').textContent = '';
    if (!lecture) { $('setupErr').textContent = 'اكتب اسم المحاضرة.'; return; }
    if (!pass) { $('setupErr').textContent = 'اكتب كلمة المرور.'; return; }
    if (typeof SCRIPT_URL === 'undefined' || SCRIPT_URL.indexOf('PASTE_') === 0) {
      $('setupErr').textContent = 'رابط السيرفر غير موجود في ملف config.js.'; return;
    }
    try { localStorage.setItem('att_lecture', lecture); } catch (e) {}
    $('startBtn').disabled = true;
    const ok = await refresh(true);
    $('startBtn').disabled = false;
    if (ok) { running = true; show('live'); $('lectureName').textContent = lecture; }
  };

  async function refresh(first) {
    clearTimeout(timer);
    try {
      const qs = new URLSearchParams({ action: 'token', pass: pass, lecture: lecture });
      const res = await fetch(SCRIPT_URL + '?' + qs.toString(), { cache: 'no-store' });
      const data = await res.json();
      if (!data.ok) {
        if (first) { $('setupErr').textContent = data.error || 'حدث خطأ.'; return false; }
        $('liveErr').textContent = data.error || 'حدث خطأ.';
        schedule(4000); return false;
      }
      $('liveErr').textContent = '';
      draw(data.token);
      $('count').textContent = data.count;
      $('winSec').textContent = data.windowSec;
      animateBar(data.secondsLeft, data.windowSec);
      schedule(Math.max(1500, data.secondsLeft * 1000 + 400));
      return true;
    } catch (e) {
      if (first) { $('setupErr').textContent = 'تعذّر الاتصال بالسيرفر. تأكد من الإنترنت ومن رابط config.js.'; return false; }
      $('liveErr').textContent = 'انقطع الاتصال، تتم إعادة المحاولة…';
      schedule(4000); return false;
    }
  }
  function schedule(ms) { if (running || ms) timer = setTimeout(function () { if (running) refresh(false); }, ms); }

  function draw(text) {
    $('qr').innerHTML = '';
    qr = new QRCode($('qr'), { text: text, width: 512, height: 512, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.L });
  }

  function animateBar(left, total) {
    const el = $('barFill');
    if (anim) anim.cancel();
    el.style.transform = 'scaleX(' + (left / total) + ')';
    if (el.animate && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      anim = el.animate([{ transform: 'scaleX(' + (left / total) + ')' }, { transform: 'scaleX(0)' }], { duration: left * 1000, easing: 'linear', fill: 'forwards' });
    }
  }

  $('stopBtn').onclick = function () {
    running = false; clearTimeout(timer);
    if (document.fullscreenElement) document.exitFullscreen();
    $('pass').value = ''; pass = '';
    show('setup');
  };
  $('fsBtn').onclick = function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  };
})();
</script>
</body>
</html>
